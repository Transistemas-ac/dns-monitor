name = "dns-monitor"
main = "src/worker.js"
compatibility_date = "2025-11-11"

kv_namespaces = [
  { binding = "DNS_MONITOR", id = "aca58e031e124d9bb4199129a2b38332", preview_id = "420fd272cb164d61bb21d921384eb566" }
]

[triggers]
crons = ["*/10 * * * *"]

[vars]
# Lista de dominios a monitorear (JSON array).
# ⚠️ Estos valores son un ejemplo para transistemas.org - cambialos por tu propio dominio y tus correos.
# Todos los campos excepto zoneId/zoneName/mailTo/mailFrom son opcionales.
DOMAINS = """[
  {
    "zoneId": "cf7c2d683422b79b8b1f629ed4707781",
    "zoneName": "transistemas.org",
    "mailTo": "equipo@transistemas.org",
    "mailFrom": "dns@transistemas.org",
    "expiryAlertDays": [60, 30, 14, 7, 1],
    "expectMX": true,
    "expectSPF": true,
    "expectDMARC": true,
    "expectDKIM": true
  }
]"""

# Opcional: URL de ping de Healthchecks.io (watchdog externo del monitor)
# Se configura como secreto con: npx wrangler secret put HEALTHCHECKS_URL
# Ejemplo: https://hc-ping.com/<uuid>

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
