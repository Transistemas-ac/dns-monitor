name = "dns-monitor"
main = "src/worker.js"
compatibility_date = "2025-11-11"

kv_namespaces = [
  { binding = "DNS_MONITOR", id = "aca58e031e124d9bb4199129a2b38332" }
]

[[d1_databases]]
binding = "DB"
database_name = "dns-monitor"
database_id = "7b1a6d94-3b13-480b-97ae-bce56bde0df7"
migrations_dir = "migrations"

routes = [
  { pattern = "dns.transistemas.org", custom_domain = true }
]

[assets]
directory = "./public"

[triggers]
crons = ["*/10 * * * *"]

[vars]
# Remitente de los emails de sistema (debe estar verificado en Resend del operador).
SYSTEM_MAIL_FROM = "DNS Monitor <dns@transistemas.org>"

# Modo self-host (solo se usa si no hay base de datos D1 configurada).
# En modo SaaS los dominios y secretos se gestionan desde el dashboard (/register).
# ⚠️ Estos valores son un ejemplo para transistemas.org - cambialos por tu propio dominio y tus correos.
# Todos los campos excepto zoneId/zoneName/mailTo/mailFrom son opcionales.
DOMAINS = """[
  {
    "zoneId": "cf7c2d683422b79b8b1f629ed4707781",
    "zoneName": "transistemas.org",
    "mailTo": "equipo@transistemas.org",
    "mailFrom": "dns@transistemas.org",
    "expiryAlertDays": [60, 30, 14, 7, 1],
    "expectMX": true,
    "expectSPF": true,
    "expectDMARC": true,
    "expectDKIM": true
  }
]"""

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true